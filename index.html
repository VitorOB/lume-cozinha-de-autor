<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141210" />
    <meta name="color-scheme" content="dark" />

    <title>Lume — Cozinha de Autor | Restaurante contemporâneo</title>
    <meta
      name="description"
      content="Cozinha autoral de ingredientes brasileiros e técnica francesa. Menu degustação em sete etapas e carta reduzida. Jantar de terça a sábado."
    />

    <!-- Versões por idioma (o inglês é a mesma página com ?lang=en) -->
    <link rel="alternate" hreflang="pt-BR" href="https://lume-cozinha-de-autor.vercel.app/" />
    <link rel="alternate" hreflang="en" href="https://lume-cozinha-de-autor.vercel.app/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://lume-cozinha-de-autor.vercel.app/" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:url" content="https://lume-cozinha-de-autor.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Lume — Cozinha de Autor" />
    <meta property="og:title" content="Lume — Cozinha de Autor" />
    <meta
      property="og:description"
      content="Cozinha autoral de ingredientes brasileiros e técnica francesa. Somente no jantar."
    />
    <meta property="og:image" content="https://lume-cozinha-de-autor.vercel.app/images/hero.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="844" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cormorant-garamond-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-800.webp"
      imagesrcset="/images/hero-800.webp 800w, /images/hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <script>
      // Marca que o JS está ativo: só então as revelações na rolagem escondem algo.
      // Se o aplicativo não iniciar em 4 s, a marca sai e todo o conteúdo fica visível.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        setTimeout(function () {
          if (!window.__lumeReady) root.classList.remove("js");
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
